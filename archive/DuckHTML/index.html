<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030303">
<meta name="description" content="Duck+ — catálogo de páginas, apps e repositórios públicos do ecossistema Duck.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Duck+ — Catálogo do ecossistema</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#030303;color:#f5f5f5}*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0;background:#030303}body{min-height:100svh;overflow-x:hidden;overflow-y:auto;overscroll-behavior:none;background:radial-gradient(circle at 50% 42%,#182019 0,#080b09 28%,#030303 72%)}canvas{position:fixed;inset:0;width:100%;height:100%;opacity:.68;pointer-events:none}.scene{position:relative;z-index:2;min-height:100svh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}.glass{width:min(760px,100%);padding:clamp(40px,8vw,96px) clamp(20px,6vw,48px);border:1px solid #ffffff18;border-radius:clamp(24px,5vw,36px);background:#ffffff08;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 30px 120px #000,inset 0 1px #ffffff12;text-align:center}.duck{font-size:clamp(64px,16vw,120px);line-height:1;filter:drop-shadow(0 0 30px #b8ff6a44);animation:float 4s ease-in-out infinite}.eyebrow{letter-spacing:.28em;font-size:clamp(9px,2vw,11px);text-transform:uppercase;opacity:.55;margin:18px 0}h1{font-size:clamp(42px,12vw,104px);line-height:.9;letter-spacing:-.07em;margin:0;font-weight:800}p{font-size:clamp(14px,3.5vw,17px);opacity:.62;max-width:480px;margin:20px auto 34px;line-height:1.6}.enter{min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:16px 26px;border-radius:999px;border:1px solid #ffffff22;background:#f5f5f5;color:#050505;text-decoration:none;font-weight:750;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:.25s transform,.25s box-shadow}.enter:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 12px 50px #b8ff6a30}.enter:active{transform:scale(.98)}.direct{margin-top:20px;font-size:10px;letter-spacing:.12em;opacity:.35;text-transform:uppercase}@keyframes float{50%{transform:translateY(-10px) rotate(-2deg)}}@media(max-width:520px){.glass{padding:42px 20px}.eyebrow{letter-spacing:.2em}.enter{width:100%;max-width:320px}}@media(prefers-reduced-motion:reduce){.duck{animation:none}*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="space" aria-hidden="true"></canvas>
<main class="scene"><section class="glass">
<div class="duck" aria-hidden="true">🦆</div><div class="eyebrow">Acesso direto · Duck+</div><h1>DUCK HTML</h1>
<p>O catálogo direto do ecossistema Duck. Páginas, apps e repositórios públicos em um único lugar.</p>
<a class="enter" href="./tool/" aria-label="Abrir catálogo Duck">ABRIR CATÁLOGO <span>↗</span></a>
<div class="direct">Catálogo Duck · páginas · apps · repositórios</div>
</section></main>
<script>
const c=document.querySelector('#space'),x=c.getContext('2d');let w,h,p=[];function resize(){const d=Math.min(devicePixelRatio||1,2);w=c.width=innerWidth*d;h=c.height=innerHeight*d;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';p=Array.from({length:Math.min(180,Math.max(70,innerWidth/6))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5,d:.15+Math.random()*.5}))}function draw(){x.clearRect(0,0,w,h);x.fillStyle='#fff';p.forEach(a=>{a.y+=a.d;if(a.y>h)a.y=0;x.globalAlpha=.12+Math.random()*.35;x.beginPath();x.arc(a.x,a.y,a.r*(devicePixelRatio||1),0,Math.PI*2);x.fill()});requestAnimationFrame(draw)}addEventListener('resize',resize,{passive:true});resize();draw();
</script>
</body></html>
